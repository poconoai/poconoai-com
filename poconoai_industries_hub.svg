<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Industries We Serve — Regulated Sectors Built on Trust</title>
  <desc id="desc">Hub-and-spoke diagram showing Pocono AI's Sentinel Node at the center with six regulated industries arranged around it: healthcare, legal, government, financial services, insurance, and education.</desc>

  <defs>
    <linearGradient id="indBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fbf82" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3fbf82" stop-opacity="0"/>
    </radialGradient>
    <filter id="hubShadow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1000" height="600" fill="url(#indBg)"/>

  <!-- Header -->
  <text x="500" y="48" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#e8edf2" letter-spacing="-0.01em">Industries We Serve</text>
  <text x="500" y="72" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#3fbf82" letter-spacing="0.18em">REGULATED SECTORS · GOVERNANCE-FIRST AI</text>

  <!-- Glow ring -->
  <circle cx="500" cy="330" r="220" fill="url(#hubGlow)"/>

  <!-- Center hub -->
  <g transform="translate(500, 330)">
    <circle r="78" fill="#0a1828" stroke="#3fbf82" stroke-width="1.5"/>
    <circle r="68" fill="none" stroke="#3fbf82" stroke-width="0.5" opacity="0.4"/>
    <text y="-12" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#3fbf82" letter-spacing="0.18em">SENTINEL</text>
    <text y="4" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#3fbf82" letter-spacing="0.18em">NODE</text>
    <text y="28" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#a0b4c0">Local · Auditable</text>
    <text y="44" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#a0b4c0">Human-governed</text>
  </g>

  <!-- Spokes + industry chips -->
  <!-- Healthcare (top) -->
  <line x1="500" y1="252" x2="500" y2="170" stroke="#3fbf82" stroke-width="1" opacity="0.5"/>
  <g transform="translate(500, 140)">
    <rect x="-95" y="-28" width="190" height="56" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
    <text y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#5b9cf6" letter-spacing="0.18em">SECTOR 01</text>
    <text y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">Healthcare</text>
  </g>

  <!-- Legal (top-right) -->
  <line x1="555" y1="275" x2="720" y2="200" stroke="#3fbf82" stroke-width="1" opacity="0.5"/>
  <g transform="translate(800, 170)">
    <rect x="-95" y="-28" width="190" height="56" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
    <text y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#5b9cf6" letter-spacing="0.18em">SECTOR 02</text>
    <text y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">Legal</text>
  </g>

  <!-- Financial (right) -->
  <line x1="578" y1="330" x2="720" y2="330" stroke="#3fbf82" stroke-width="1" opacity="0.5"/>
  <g transform="translate(820, 330)">
    <rect x="-95" y="-28" width="190" height="56" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
    <text y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#5b9cf6" letter-spacing="0.18em">SECTOR 03</text>
    <text y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">Financial Services</text>
  </g>

  <!-- Government (bottom-right) -->
  <line x1="555" y1="385" x2="720" y2="460" stroke="#3fbf82" stroke-width="1" opacity="0.5"/>
  <g transform="translate(800, 490)">
    <rect x="-95" y="-28" width="190" height="56" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
    <text y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#5b9cf6" letter-spacing="0.18em">SECTOR 04</text>
    <text y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">Government</text>
  </g>

  <!-- Insurance (bottom) -->
  <line x1="500" y1="408" x2="500" y2="490" stroke="#3fbf82" stroke-width="1" opacity="0.5"/>
  <g transform="translate(500, 520)">
    <rect x="-95" y="-28" width="190" height="56" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
    <text y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#5b9cf6" letter-spacing="0.18em">SECTOR 05</text>
    <text y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">Insurance</text>
  </g>

  <!-- Education (bottom-left) -->
  <line x1="445" y1="385" x2="280" y2="460" stroke="#3fbf82" stroke-width="1" opacity="0.5"/>
  <g transform="translate(200, 490)">
    <rect x="-95" y="-28" width="190" height="56" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
    <text y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#5b9cf6" letter-spacing="0.18em">SECTOR 06</text>
    <text y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">Education</text>
  </g>

  <!-- MSP (left) -->
  <line x1="422" y1="330" x2="280" y2="330" stroke="#3fbf82" stroke-width="1" opacity="0.5"/>
  <g transform="translate(180, 330)">
    <rect x="-95" y="-28" width="190" height="56" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
    <text y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#5b9cf6" letter-spacing="0.18em">PARTNERS</text>
    <text y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">MSPs &amp; Integrators</text>
  </g>

  <!-- Top-left (Regional Operators) -->
  <line x1="445" y1="275" x2="280" y2="200" stroke="#3fbf82" stroke-width="1" opacity="0.5"/>
  <g transform="translate(200, 170)">
    <rect x="-95" y="-28" width="190" height="56" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
    <text y="-6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#5b9cf6" letter-spacing="0.18em">FEDERATION</text>
    <text y="14" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">Regional Operators</text>
  </g>
</svg>
