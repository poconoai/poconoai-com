<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Pilot Timeline — 30–60 Days from First Call to Signed Agreement</title>
  <desc id="desc">Five-phase pilot timeline: Discovery, Scoping, Deployment, Live Pilot, Results — showing the path from initial conversation to signed agreement in 30 to 60 days.</desc>

  <defs>
    <linearGradient id="ptBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#f0f3f7"/>
    </linearGradient>
    <linearGradient id="ptLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b9cf6"/>
      <stop offset="100%" stop-color="#3fbf82"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#ptBg)"/>

  <!-- Header -->
  <text x="600" y="48" text-anchor="middle" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#0d1d35" letter-spacing="-0.01em">Pilot Timeline · First Call to Signed Agreement</text>
  <text x="600" y="72" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#5b9cf6" letter-spacing="0.18em">30 – 60 DAYS · 5 PHASES · ONE OUTCOME</text>

  <!-- Timeline backbone -->
  <line x1="120" y1="220" x2="1080" y2="220" stroke="url(#ptLine)" stroke-width="2"/>

  <!-- Phase nodes -->
  <g font-family="'IBM Plex Sans', sans-serif">
    <!-- Phase 1: Week 1-2 Discovery -->
    <g transform="translate(120, 220)">
      <circle r="20" fill="#fff" stroke="#5b9cf6" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#5b9cf6">01</text>
      <text y="-44" text-anchor="middle" font-size="11" font-weight="700" fill="#5b9cf6" letter-spacing="0.12em">WEEK 1–2</text>
      <text y="-28" text-anchor="middle" font-size="14" font-weight="600" fill="#0d1d35">Discovery</text>
      <text y="56" text-anchor="middle" font-size="11" fill="#5a6a7a">Learn your</text>
      <text y="70" text-anchor="middle" font-size="11" fill="#5a6a7a">pain points</text>
      <text y="84" text-anchor="middle" font-size="11" fill="#5a6a7a">and goals.</text>
    </g>

    <!-- Phase 2: Week 3-4 Scoping -->
    <g transform="translate(360, 220)">
      <circle r="20" fill="#fff" stroke="#5b9cf6" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#5b9cf6">02</text>
      <text y="-44" text-anchor="middle" font-size="11" font-weight="700" fill="#5b9cf6" letter-spacing="0.12em">WEEK 3–4</text>
      <text y="-28" text-anchor="middle" font-size="14" font-weight="600" fill="#0d1d35">Scoping</text>
      <text y="56" text-anchor="middle" font-size="11" fill="#5a6a7a">Define use cases</text>
      <text y="70" text-anchor="middle" font-size="11" fill="#5a6a7a">and success</text>
      <text y="84" text-anchor="middle" font-size="11" fill="#5a6a7a">metrics.</text>
    </g>

    <!-- Phase 3: Week 5-6 Deployment -->
    <g transform="translate(600, 220)">
      <circle r="22" fill="#fff" stroke="#3fbf82" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#3fbf82">03</text>
      <text y="-44" text-anchor="middle" font-size="11" font-weight="700" fill="#3fbf82" letter-spacing="0.12em">WEEK 5–6</text>
      <text y="-28" text-anchor="middle" font-size="14" font-weight="600" fill="#0d1d35">Deployment</text>
      <text y="56" text-anchor="middle" font-size="11" fill="#5a6a7a">Ship and install</text>
      <text y="70" text-anchor="middle" font-size="11" fill="#5a6a7a">Sentinel Node</text>
      <text y="84" text-anchor="middle" font-size="11" fill="#5a6a7a">on-site.</text>
    </g>

    <!-- Phase 4: Week 7-10 Live -->
    <g transform="translate(840, 220)">
      <circle r="20" fill="#fff" stroke="#3fbf82" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" fill="#3fbf82">04</text>
      <text y="-44" text-anchor="middle" font-size="11" font-weight="700" fill="#3fbf82" letter-spacing="0.12em">WEEK 7–10</text>
      <text y="-28" text-anchor="middle" font-size="14" font-weight="600" fill="#0d1d35">Live Pilot</text>
      <text y="56" text-anchor="middle" font-size="11" fill="#5a6a7a">Real work.</text>
      <text y="70" text-anchor="middle" font-size="11" fill="#5a6a7a">Real data.</text>
      <text y="84" text-anchor="middle" font-size="11" fill="#5a6a7a">Measure results.</text>
    </g>

    <!-- Phase 5: Week 11-12 Decision -->
    <g transform="translate(1080, 220)">
      <circle r="22" fill="#fff" stroke="#3fbf82" stroke-width="3"/>
      <circle r="13" fill="#3fbf82"/>
      <text y="5" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="700" fill="#fff">05</text>
      <text y="-44" text-anchor="middle" font-size="11" font-weight="700" fill="#3fbf82" letter-spacing="0.12em">WEEK 11–12</text>
      <text y="-28" text-anchor="middle" font-size="14" font-weight="600" fill="#0d1d35">Decision</text>
      <text y="56" text-anchor="middle" font-size="11" fill="#5a6a7a">Review outcomes.</text>
      <text y="70" text-anchor="middle" font-size="11" fill="#5a6a7a">Plan next steps.</text>
      <text y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#3fbf82">Sign or stop.</text>
    </g>
  </g>

  <!-- Bottom promise band -->
  <rect x="0" y="350" width="1200" height="70" fill="#0d1d35"/>
  <text x="600" y="382" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#3fbf82" letter-spacing="0.2em">POCONO AI PILOT PROMISE</text>
  <text x="600" y="404" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#c8d8e4">Prove the value. Protect privilege. Save time. Reduce costs. Win more for your clients.</text>
</svg>
