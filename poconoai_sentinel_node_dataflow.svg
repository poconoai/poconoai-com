<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel Node Data Flow — Pocono AI</title>
  <desc id="desc">Diagram showing data entering the on-premises Sentinel Node, being processed locally through inference, human review, and audit logging — with zero data egress to external clouds.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d1d35"/>
    </linearGradient>
    <linearGradient id="boundary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fbf82" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#3fbf82" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3fbf82" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fbf82" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3fbf82" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="48" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#e8edf2" letter-spacing="-0.01em">Sentinel Node — On-Premises Data Flow</text>
  <text x="40" y="72" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#5b9cf6" letter-spacing="0.18em">YOUR NETWORK BOUNDARY</text>

  <!-- Boundary box -->
  <rect x="60" y="105" width="1080" height="395" fill="none" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
  <text x="80" y="128" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#3fbf82" letter-spacing="0.18em">▣ AIR-GAPPED PERIMETER</text>

  <!-- Stage 1: Source -->
  <g transform="translate(110, 230)">
    <rect width="140" height="110" rx="6" fill="url(#nodeGrad)" stroke="#2c4f7e" stroke-width="1"/>
    <text x="70" y="32" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#5b9cf6" letter-spacing="0.15em">SOURCE</text>
    <text x="70" y="58" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">EHR / DMS</text>
    <text x="70" y="78" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#7a8a9a">Documents</text>
    <text x="70" y="94" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#7a8a9a">PHI / Privileged</text>
  </g>

  <!-- Arrow -->
  <path d="M 260 285 L 320 285" stroke="#3fbf82" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 2: Sentinel Node (centerpiece) -->
  <g transform="translate(330, 180)">
    <ellipse cx="160" cy="100" rx="200" ry="140" fill="url(#glow)"/>
    <rect width="320" height="210" rx="10" fill="url(#nodeGrad)" stroke="#3fbf82" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="160" y="34" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#3fbf82" letter-spacing="0.2em">SENTINEL NODE</text>
    <text x="160" y="62" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="20" font-weight="700" fill="#e8edf2">Local Inference</text>

    <!-- Three internal layers -->
    <g transform="translate(20, 86)">
      <rect width="280" height="32" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
      <circle cx="20" cy="16" r="4" fill="#3fbf82"/>
      <text x="36" y="20" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#c8d8e4">Encrypted ingestion + redaction</text>
    </g>
    <g transform="translate(20, 124)">
      <rect width="280" height="32" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
      <circle cx="20" cy="16" r="4" fill="#5b9cf6"/>
      <text x="36" y="20" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#c8d8e4">Model inference (on-device GPU)</text>
    </g>
    <g transform="translate(20, 162)">
      <rect width="280" height="32" rx="4" fill="#0a1828" stroke="#2c4f7e"/>
      <circle cx="20" cy="16" r="4" fill="#a78bfa"/>
      <text x="36" y="20" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#c8d8e4">Structured output + provenance</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 660 285 L 720 285" stroke="#3fbf82" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 3: Human Review -->
  <g transform="translate(730, 230)">
    <rect width="140" height="110" rx="6" fill="url(#nodeGrad)" stroke="#2c4f7e" stroke-width="1"/>
    <text x="70" y="32" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#5b9cf6" letter-spacing="0.15em">HUMAN</text>
    <text x="70" y="58" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">Review</text>
    <text x="70" y="78" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#7a8a9a">Approve · Edit</text>
    <text x="70" y="94" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#7a8a9a">Override · Decide</text>
  </g>

  <!-- Arrow -->
  <path d="M 880 285 L 940 285" stroke="#3fbf82" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 4: Audit -->
  <g transform="translate(950, 230)">
    <rect width="140" height="110" rx="6" fill="url(#nodeGrad)" stroke="#2c4f7e" stroke-width="1"/>
    <text x="70" y="32" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#5b9cf6" letter-spacing="0.15em">AUDIT</text>
    <text x="70" y="58" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="600" fill="#e8edf2">Immutable</text>
    <text x="70" y="78" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#7a8a9a">Every input</text>
    <text x="70" y="94" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#7a8a9a">Every output</text>
  </g>

  <!-- Zero egress badge -->
  <g transform="translate(490, 430)">
    <rect x="-110" y="-22" width="220" height="44" rx="22" fill="#0a1828" stroke="#3fbf82" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#3fbf82" letter-spacing="0.15em">ZERO EGRESS</text>
    <text x="0" y="20" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#7a8a9a">No data leaves the perimeter</text>
  </g>

  <!-- External cloud (crossed out) -->
  <g transform="translate(950, 420)" opacity="0.55">
    <path d="M 20 30 Q 0 30 0 50 Q 0 70 20 70 L 80 70 Q 100 70 100 50 Q 100 30 80 30 L 70 30 Q 60 12 40 16 Q 22 18 20 30 Z"
          fill="#1a1f2e" stroke="#6a3030" stroke-width="1.2"/>
    <line x1="-4" y1="22" x2="108" y2="78" stroke="#9a3030" stroke-width="2.5" opacity="0.9"/>
    <text x="50" y="98" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#9a3030" letter-spacing="0.1em">EXTERNAL CLOUD</text>
    <text x="50" y="112" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#9a3030" letter-spacing="0.1em">NOT USED</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#3fbf82"/>
    </marker>
  </defs>

  <!-- Footer caption -->
  <text x="600" y="555" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#5a6a7a" letter-spacing="0.15em">POCONOAI.COM · GOVERNANCE-FIRST AI INFRASTRUCTURE</text>
</svg>
